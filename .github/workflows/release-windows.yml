name: 打包 Windows exe 并发布 Release

# 手动点击触发:仓库页面 Actions → 左侧选本工作流 → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号(同时作为 git tag 和 Release 名称,例如 v0.1.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "标记为预发布(Pre-release)"
        type: boolean
        default: false

permissions:
  contents: write        # 创建 / 更新 Release 需要写权限

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash     # 统一用 bash,glob 和路径处理比 PowerShell 更可预期
    env:
      # Windows runner 的区域设置是英文,stdout 被重定向时 Python 默认按 cp1252
      # 编码,脚本里打印中文会抛 UnicodeEncodeError。整个 job 统一成 UTF-8。
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        # setup-uv 从 v8 起不再发布滚动主版本标签,官方建议固定到精确版本
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 按 uv.lock 安装依赖
        run: uv sync --frozen

      - name: 打包 exe
        run: uv run pyinstaller --clean --noconfirm mark-tool.spec

      - name: 查看产物体积
        run: ls -lh dist/

      - name: 校验多余文件确实被剔除
        run: |
          uv run python - <<'PY'
          import glob
          from PyInstaller.archive.readers import CArchiveReader

          exe = glob.glob("dist/*.exe")[0]
          names = [n.replace("\\", "/").lower() for n in CArchiveReader(exe).toc]
          print("产物 %s,包内共 %d 项" % (exe, len(names)))

          # mark-tool.spec 的 DROP_BASENAMES 应该已经把它们剔掉。这些是
          # PyInstaller 的 Qt hook 在 Windows 上会无条件附带的"动态 OpenGL"
          # 运行库,合计约 25MB,本工具走光栅绘制,用不到。
          # 注意:纯 Python 模块(openpyxl 等)被压在包内的 PYZ.pyz 里,不在
          # 这份列表内,它们能否正常工作由上面的冒烟测试实际验证。
          for bad in ("opengl32sw.dll", "libegl.dll", "libglesv2.dll",
                      "d3dcompiler_"):
              hits = [n for n in names if bad in n]
              if hits:
                  raise SystemExit("::error::多余文件仍被打进包: %s" % hits)

          # 生成脚本是运行时按文件名动态加载的数据文件,漏了 exe 就跑不起来
          for need in ("generate_marks_南北-0906.py",
                       "generate_marks_东西-0906.py"):
              if not any(need in n for n in names):
                  raise SystemExit("::error::包内缺少生成脚本: %s" % need)

          print("校验通过:无用的 OpenGL 运行库已剔除,生成脚本已带上")
          PY

      - name: 冒烟测试(用打包好的 exe 真跑一次生成)
        run: |
          set -u
          EXE=$(ls dist/*.exe | head -1)
          echo "待测产物: $EXE"

          # 当前测例在 cases/wichita-唛头/ 下,先确认文件还在:windowed 的 exe 没有
          # 控制台,测例缺失时只会表现成"等不到输出文件",看不出原因。
          CASES="cases/wichita-唛头"
          NS_IN="$CASES/input-Shipping details for Wichita.xlsx"
          EW_IN="$CASES/副本input-Shipping details for Wichita.xlsx"
          for f in "$NS_IN" "$EW_IN"; do
            if [ ! -f "$f" ]; then
              echo "::error::冒烟测试用的测例文件不存在: $f"
              echo "目录 $CASES 现有内容:"
              ls -1 "$CASES" 2>/dev/null || echo "(目录不存在)"
              exit 1
            fi
          done

          # 复制成短名字再跑,避免中文长文件名在 Windows 上撞 260 字符上限
          WORK="smoke-work"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp "$NS_IN" "$WORK/ns.xlsx"
          cp "$EW_IN" "$WORK/ew.xlsx"

          # 案例1: 1号 sheet 只有南北方向的货(EW1..EW7 全空),东西方向预期报错;
          #        顺便验证"生成失败不留文件"——失败的那一路不应该写出东西唛头。
          NS_OUT="$WORK/ns-1号-南北唛头.xlsx"
          NS_OUT_EW="$WORK/ns-1号-东西唛头.xlsx"
          rm -f "$NS_OUT" "$NS_OUT_EW"
          "$EXE" --selftest "$WORK/ns.xlsx" --sheet "1号" \
            --gw-sheet "Batch_01_GW" || true
          for _ in $(seq 1 60); do
            [ -f "$NS_OUT" ] && break
            sleep 2
          done

          # 案例2: 2号 sheet 南北/东西都有货,覆盖东西方向的生成脚本。
          EW_OUT="$WORK/ew-2号-南北唛头.xlsx"
          EW_OUT_EW="$WORK/ew-2号-东西唛头.xlsx"
          rm -f "$EW_OUT" "$EW_OUT_EW"
          "$EXE" --selftest "$WORK/ew.xlsx" --sheet "2号" \
            --gw-sheet "Batch_01_GW" || true
          for _ in $(seq 1 60); do
            [ -f "$EW_OUT" ] && [ -f "$EW_OUT_EW" ] && break
            sleep 2
          done

          fail=0
          [ -f "$NS_OUT" ]      || { echo "::error::1号 sheet 没有产出南北唛头"; fail=1; }
          [ ! -f "$NS_OUT_EW" ] || { echo "::error::1号 sheet 没有 EW 数据,却产出了东西唛头(失败时不该创建文件)"; fail=1; }
          [ -f "$EW_OUT" ]      || { echo "::error::2号 sheet 没有产出南北唛头"; fail=1; }
          [ -f "$EW_OUT_EW" ]   || { echo "::error::2号 sheet 没有产出东西唛头"; fail=1; }
          if ls "$WORK"/*.part.xlsx >/dev/null 2>&1; then
            echo "::error::残留了未清理的临时文件: $(ls "$WORK"/*.part.xlsx)"
            fail=1
          fi
          if [ "$fail" != "0" ]; then
            # exe 是 windowed 构建,没有控制台,生成脚本打印的报错看不到。用同一份
            # 代码(未打包)重跑一遍,真实原因就会直接打在上面的 CI 日志里。
            echo "::group::诊断: 用未打包的脚本重跑同样的自检"
            for case in "ns.xlsx:1号" "ew.xlsx:2号"; do
              file="${case%%:*}"; sheet="${case##*:}"
              echo "----- $file / $sheet -----"
              uv run python gui_marks.py --selftest "$WORK/$file" \
                --sheet "$sheet" --gw-sheet "Batch_01_GW" || true
            done
            echo "::endgroup::"
            echo "----- 工作目录 -----"; ls -la "$WORK" 2>/dev/null || true
            rm -rf "$WORK"
            exit 1
          fi
          echo "冒烟测试通过: exe 能加载内置的两个生成脚本并写出唛头,失败的那一路未留文件"
          rm -rf "$WORK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          # exe 文件名必须是 ASCII(GitHub 会剥离非字母数字字符),
          # 中文名字靠资源的 label 在发布页上展示
          ASSET_LABEL: 小小工具
        # 具体逻辑在 scripts/publish_release.py 里(见该文件顶部说明)
        run: uv run python scripts/publish_release.py
